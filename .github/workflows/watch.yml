name: srt-watch

on:
  # GitHub Actions 의 스케줄러는 5분 미만 cron 을 사실상 지키지 않고,
  # 그마저도 high-load 시 수십 분씩 지연됨. 그래서 cron 은 5분으로 고정하고,
  # 발화된 러너 안에서 watch.py 를 10회(≈ 100초) 반복 실행하여 감시 공백을 줄인다.
  schedule:
    - cron: '*/5 * * * *'
  # 수동 트리거
  workflow_dispatch:

concurrency:
  # 이전 실행이 아직 돌고 있으면 새 실행을 뒤로 미루지 않고 취소
  group: srt-watch
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps (SRTrain 은 NetFunnel 대응된 GitHub master)
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install "git+https://github.com/ryanking13/SRT.git@master"

      - name: Restore state.json from cache
        id: state-restore
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: srt-watch-state-${{ github.run_id }}
          restore-keys: |
            srt-watch-state-

      - name: Run watch.py in a 10s-interval loop (10 iterations ≈ 100s)
        env:
          KC_SRT_ID: ${{ secrets.SRT_ID }}
          KC_SRT_PW: ${{ secrets.SRT_PW }}
          KC_TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          KC_TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          for i in $(seq 1 10); do
            echo "=== iteration $i/10 ==="
            python watch.py || echo "[iter $i] failed (continuing)"
            # 마지막 iteration 뒤에는 sleep 불필요
            if [ "$i" -lt 10 ]; then
              sleep 10
            fi
          done

      - name: Save state.json to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: srt-watch-state-${{ github.run_id }}
