name: srt-watch

on:
  # 1분 간격 (public repo 라 Actions 분 무제한. 실제 발화는 GitHub 스케줄러
  # 상황에 따라 다소 지연될 수 있음 — 공식적으로도 1분 cron 은 "best-effort")
  schedule:
    - cron: '* * * * *'
  # 수동 트리거
  workflow_dispatch:

concurrency:
  # 이전 실행이 아직 돌고 있으면 새 실행을 뒤로 미루지 않고 취소
  group: srt-watch
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps (SRTrain 은 NetFunnel 대응된 GitHub master)
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install "git+https://github.com/ryanking13/SRT.git@master"

      - name: Restore state.json from cache
        id: state-restore
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: srt-watch-state-${{ github.run_id }}
          restore-keys: |
            srt-watch-state-

      - name: Run watch.py
        env:
          KC_SRT_ID: ${{ secrets.SRT_ID }}
          KC_SRT_PW: ${{ secrets.SRT_PW }}
          KC_TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          KC_TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python watch.py

      - name: Save state.json to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: srt-watch-state-${{ github.run_id }}
